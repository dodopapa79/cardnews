<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>카드뉴스 메이커</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#0f1b33;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:28px 16px 80px}
h1{margin:0 0 4px;font-size:26px}
.sub{margin:0 0 20px;color:#64748b}
.box{background:#fff;border-radius:16px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
label{display:block;margin:14px 0 6px;font-size:14px;font-weight:600}
label a{font-weight:400;color:#1e4fa3;margin-left:6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d5dbe6;border-radius:10px;font:inherit;background:#fff}
textarea{resize:vertical}
input[type=color]{padding:3px;height:44px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:120px}
button{border:0;border-radius:12px;background:#1e4fa3;color:#fff;font:inherit;font-weight:700;padding:13px 18px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
#go{width:100%;margin-top:20px;font-size:17px;padding:15px}
#msg{margin-top:12px;font-size:14px;color:#b45309;white-space:pre-wrap}
.hint{font-size:13px;color:#64748b;margin-top:6px}
#out{margin-top:28px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.bar b{font-size:18px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{background:#fff;border-radius:16px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:8px}
.card canvas{width:100%;height:auto;border-radius:10px;display:block}
.card input,.card textarea{font-size:14px;padding:9px 10px}
.card button{background:#eaf0fa;color:#1e4fa3;padding:10px}
</style>
</head>
<body>
<main>
<h1>카드뉴스 메이커</h1>
<p class="sub">블로그 주소나 글을 붙여넣으면 깔끔한 카드뉴스가 만들어져요.</p>

<section class="box">
  <label>Gemini API 키 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">무료로 발급받기</a></label>
  <input id="key" type="password" placeholder="AIza..." autocomplete="off">
  <div class="hint">키는 이 브라우저에만 저장돼요.</div>

  <label>블로그 주소 또는 글 내용</label>
  <textarea id="src" rows="7" placeholder="블로그 주소(https://...) 한 줄, 또는 글 내용을 그대로 붙여넣기"></textarea>
  <div class="hint">네이버 블로그는 주소로 읽히지 않는 경우가 많아요. 그럴 땐 글 내용을 복사해서 붙여넣어 주세요.</div>

  <div class="row">
    <div><label>블로그 이름</label><input id="bname" placeholder="예: 도도파파"></div>
    <div><label>블로그 주소 (마지막 카드에 표시)</label><input id="burl" placeholder="예: blog.naver.com/아이디"></div>
  </div>
  <div class="row">
    <div><label>카드 장수</label><select id="n"><option>5</option><option selected>6</option><option>7</option><option>8</option></select></div>
    <div><label>비율</label><select id="ratio"><option value="1350">인스타 4:5</option><option value="1080">정사각 1:1</option></select></div>
    <div><label>메인 색</label><input id="color" type="color" value="#1e4fa3"></div>
    <div><label>내용 카드 배경</label><select id="mode"><option value="light">밝게</option><option value="dark">어둡게</option></select></div>
  </div>
  <button id="go">카드뉴스 만들기</button>
  <div id="msg"></div>
</section>

<section id="out" hidden>
  <div class="bar"><b>완성! 글자는 아래에서 수정할 수 있어요</b><button id="all">전체 저장</button></div>
  <div id="grid"></div>
</section>
</main>

<script>
const $=s=>document.querySelector(s);
const MODELS=['gemini-3.1-flash-lite','gemini-2.5-flash','gemini-2.5-flash-lite'];
const W=1080,SAVE=['key','bname','burl','color','mode','n','ratio'];
let H=1350,slides=[],cv=[];

try{SAVE.forEach(k=>{const v=localStorage.getItem('cn_'+k);if(v!==null)$('#'+k).value=v})}catch(e){}
H=+$('#ratio').value;
const save=()=>{try{SAVE.forEach(k=>localStorage.setItem('cn_'+k,$('#'+k).value))}catch(e){}};
const msg=t=>$('#msg').textContent=t||'';

/* ---------- Gemini ---------- */
function makePrompt(src,isUrl,n){
  return `당신은 인스타그램 카드뉴스 기획자입니다. ${isUrl?`다음 블로그 글(${src})을 읽고`:'아래 블로그 글을 바탕으로'} 카드뉴스 ${n}장을 만드세요.
규칙:
- 글에 없는 내용은 절대 지어내지 마세요. 글을 읽을 수 없으면 {"error":"읽을 수 없음"} 만 출력하세요.
- 1장 cover: label(주제 키워드 8자 이내), title(호기심을 끄는 제목 18자 이내), body(한 줄 소개 25자 이내)
- 2~${n-1}장 content: title(핵심 메시지 20자 이내), body(쉬운 설명 1~2문장 70자 이내), highlight(강조할 숫자나 핵심어 8자 이내, 없으면 빈 문자열)
- ${n}장 cta: title(글 전체를 한 문장으로 요약, 25자 이내), body(블로그에서 자세한 내용을 확인하도록 안내하는 한 문장, 30자 이내)
- 쉬운 한국어, 이모지 금지, 한 장에 한 가지 메시지만.
JSON만 출력: {"slides":[{"label":"","title":"","body":"","highlight":""}]}${isUrl?'':'\n\n[글]\n'+src.slice(0,12000)}`;
}
async function gen(key,src,isUrl,n){
  let err='';
  for(const m of MODELS){
    const body={contents:[{parts:[{text:makePrompt(src,isUrl,n)}]}],generationConfig:{temperature:.7}};
    if(isUrl)body.tools=[{url_context:{}}];else body.generationConfig.responseMimeType='application/json';
    let r,j;
    try{
      r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});
      j=await r.json();
    }catch(e){throw new Error('네트워크 오류가 났어요. 인터넷 연결을 확인해 주세요.')}
    if(!r.ok){
      err=(j.error&&j.error.message)||('오류 '+r.status);
      if(/API key/i.test(err))throw new Error('API 키가 올바르지 않아요. 키를 다시 확인해 주세요.');
      continue; // 다음 모델로 재시도
    }
    const c=(j.candidates||[])[0]||{};
    const text=((c.content||{}).parts||[]).map(p=>p.text||'').join('');
    if(isUrl){
      const md=c.urlContextMetadata||c.url_context_metadata||{};
      const list=md.urlMetadata||md.url_metadata||[];
      if(!list.some(u=>/SUCCESS/.test(u.urlRetrievalStatus||u.url_retrieval_status||'')))
        throw new Error('이 주소의 글을 읽지 못했어요.\n글 내용을 복사해서 붙여넣어 주세요.');
    }
    let o;
    try{o=JSON.parse(text.replace(/```json|```/g,'').match(/\{[\s\S]*\}/)[0])}catch(e){err='결과를 해석하지 못했어요. 다시 시도해 주세요.';continue}
    if(o.error)throw new Error('글을 읽을 수 없었어요. 글 내용을 복사해서 붙여넣어 주세요.');
    let a=(o.slides||[]).filter(s=>s&&s.title);
    if(a.length<2){err='카드를 만들지 못했어요. 다시 시도해 주세요.';continue}
    if(a.length>n)a=[...a.slice(0,n-1),a[a.length-1]];
    return a;
  }
  throw new Error('생성에 실패했어요: '+err+'\n(무료 한도 초과일 수 있어요. 잠시 후 다시 시도해 주세요.)');
}

/* ---------- 색상 ---------- */
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>'#'+hx(a).map((v,i)=>Math.round(v*(1-t)+hx(b)[i]*t).toString(16).padStart(2,'0')).join('');
const lum=h=>{const[r,g,b]=hx(h);return(.299*r+.587*g+.114*b)/255};
function theme(main,mode){
  const d=mode==='dark';
  return{main,onMain:lum(main)<.62?'#ffffff':'#111111',
    bg:d?mix(main,'#000000',.82):mix(main,'#ffffff',.95),
    ink:d?'#ffffff':mix(main,'#000000',.78),
    sub:d?'#cbd5e1':'#475569',
    acc:d?mix(main,'#ffffff',.35):main,
    line:d?'rgba(255,255,255,.15)':'rgba(0,0,0,.08)'};
}

/* ---------- 카드 그리기 ---------- */
const F=(w,s)=>`${w} ${s}px Pretendard,"Noto Sans KR",system-ui,sans-serif`;
const rr=(x,a,b,w,h,r)=>{x.beginPath();x.roundRect?x.roundRect(a,b,w,h,r):x.rect(a,b,w,h)};
function wrap(x,t,max){ // 단어 단위 줄바꿈 (긴 단어만 글자 단위)
  const out=[];
  for(const para of String(t||'').split('\n')){
    let cur='';
    for(const w of para.split(' ')){
      const s=cur?cur+' '+w:w;
      if(x.measureText(s).width<=max){cur=s;continue}
      if(cur){out.push(cur);cur=''}
      if(x.measureText(w).width<=max){cur=w;continue}
      for(const ch of w){if(x.measureText(cur+ch).width>max){out.push(cur);cur=ch}else cur+=ch}
    }
    out.push(cur);
  }
  return out;
}
function fit(x,t,wt,size,min,max,ln){ // 줄 수가 넘치면 글자 크기를 줄임
  let s=size,l;
  for(;;){x.font=F(wt,s);l=wrap(x,t,max);if(l.length<=ln||s<=min)return{s,l};s-=4}
}
function draw(i){
  const s=slides[i],c=cv[i],x=c.getContext('2d'),T=theme($('#color').value,$('#mode').value);
  const P=96,M=W-P*2,N=slides.length,bn=$('#bname').value.trim();
  const url=$('#burl').value.trim().replace(/^https?:\/\//,'').replace(/\/$/,'');
  c.width=W;c.height=H;
  const cover=i===0,cta=i===N-1,solid=cover||cta;
  const ink=solid?T.onMain:T.ink,sub=solid?T.onMain:T.sub;
  x.fillStyle=solid?T.main:T.bg;x.fillRect(0,0,W,H);
  if(solid){x.globalAlpha=.08;x.fillStyle=T.onMain;x.beginPath();x.arc(W-40,120,300,0,7);x.fill();x.beginPath();x.arc(80,H-60,200,0,7);x.fill();x.globalAlpha=1}
  x.textBaseline='top';
  // 상단: 블로그 이름 / 페이지 번호
  x.font=F(600,28);x.fillStyle=sub;x.globalAlpha=.75;
  x.textAlign='left';x.fillText(bn,P,P-8);
  x.textAlign='right';x.fillText(String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0'),W-P,P-8);
  x.globalAlpha=1;
  // 하단: 진행 막대
  x.fillStyle=solid?'rgba(255,255,255,.25)':T.line;x.fillRect(P,H-P+10,M,6);
  x.fillStyle=solid?T.onMain:T.acc;x.fillRect(P,H-P+10,M*(i+1)/N,6);
  x.textAlign='left';

  const mk=sc=>{
    const bl=[];
    const txt=(t,wt,size,min,ln,lh,col,al,gap)=>{
      if(!String(t||'').trim())return;
      const f=fit(x,t,wt,Math.round(size*sc),Math.round(min*sc),M,ln);
      bl.push({h:f.l.length*f.s*lh,gap,d:y=>{x.font=F(wt,f.s);x.fillStyle=col;x.globalAlpha=al;
        f.l.forEach((l,k)=>x.fillText(l,P,y+k*f.s*lh+(lh-1)*f.s/2));x.globalAlpha=1}});
    };
    if(cover){
      if(String(s.label||'').trim()){
        x.font=F(700,30);const w=x.measureText(s.label).width+56;
        bl.push({h:64,gap:0,d:y=>{x.globalAlpha=.2;x.fillStyle=T.onMain;rr(x,P,y,w,64,32);x.fill();x.globalAlpha=1;
          x.font=F(700,30);x.fillStyle=T.onMain;x.fillText(s.label,P+28,y+17)}});
      }
      txt(s.title,800,116,68,5,1.2,ink,1,56);
      txt(s.body,500,44,34,3,1.5,sub,.9,44);
    }else if(cta){
      txt(s.title,800,84,56,4,1.25,ink,1,0);
      txt(s.body,500,44,34,3,1.5,sub,.9,40);
    }else{
      bl.push({h:10,gap:0,d:y=>{x.fillStyle=T.acc;rr(x,P,y,90,10,5);x.fill()}});
      txt(s.highlight,900,150,64,1,1.1,T.acc,1,44);
      txt(s.title,800,72,50,3,1.25,ink,1,s.highlight?20:44);
      txt(s.body,500,42,32,8,1.6,sub,1,40);
    }
    return bl;
  };
  const top=P+90,bottom=cta?H-P-290:H-P-50,avail=bottom-top;
  let sc=1,bl,total;
  for(;;){
    bl=mk(sc);total=bl.reduce((a,b,k)=>a+b.h+(k?b.gap*sc:0),0);
    if(total<=avail||sc<=.6)break;sc-=.08;
  }
  let y=top+Math.max(0,Math.min((avail-total)/2,solid?999:160));
  bl.forEach((b,k)=>{if(k)y+=b.gap*sc;b.d(y);y+=b.h});

  if(cover){x.textAlign='right';x.font=F(600,30);x.fillStyle=T.onMain;x.globalAlpha=.85;x.fillText('옆으로 넘겨보세요 →',W-P,H-P-50);x.globalAlpha=1;x.textAlign='left'}
  if(cta){ // 블로그 안내 버튼
    const by=H-P-250,bh=120;
    x.fillStyle=T.onMain;rr(x,P,by,M,bh,60);x.fill();
    x.fillStyle=T.main;x.font=F(800,42);x.textAlign='center';
    x.fillText('블로그에서 자세히 보기  →',W/2,by+(bh-42)/2);
    if(url){x.font=F(500,30);x.fillStyle=T.onMain;x.globalAlpha=.9;x.fillText(url.length>40?url.slice(0,39)+'…':url,W/2,by+bh+34);x.globalAlpha=1}
    x.textAlign='left';
  }
}
const redraw=()=>slides.forEach((_,i)=>draw(i));

/* ---------- 화면 ---------- */
async function show(){
  const all=slides.map(s=>Object.values(s).join('')).join('')+'블로그에서 자세히 보기 옆으로 넘겨보세요 0123456789/';
  try{await Promise.all([500,600,700,800,900].map(w=>document.fonts.load(`${w} 40px Pretendard`,all)))}catch(e){}
  const g=$('#grid');g.innerHTML='';cv=[];
  slides.forEach((s,i)=>{
    const d=document.createElement('div');d.className='card';d.dataset.i=i;
    const k2=i===0?'label':'highlight',last=i===slides.length-1;
    d.innerHTML='<canvas></canvas><input data-k="title" placeholder="제목"><textarea data-k="body" rows="2" placeholder="본문"></textarea>'
      +(last?'':`<input data-k="${k2}" placeholder="${i===0?'주제 키워드 (선택)':'강조 숫자·키워드 (선택)'}">`)
      +'<button data-dl>이 카드 저장</button>';
    ['title','body',k2].forEach(k=>{const e=d.querySelector(`[data-k="${k}"]`);if(e)e.value=s[k]||''});
    cv.push(d.querySelector('canvas'));g.append(d);
  });
  $('#out').hidden=false;redraw();msg('');
  $('#out').scrollIntoView({behavior:'smooth'});
}
function dl(i){
  cv[i].toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='cardnews_'+String(i+1).padStart(2,'0')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)});
}
$('#grid').addEventListener('input',e=>{
  const d=e.target.closest('.card');if(!d||!e.target.dataset.k)return;
  slides[+d.dataset.i][e.target.dataset.k]=e.target.value;draw(+d.dataset.i);
});
$('#grid').addEventListener('click',e=>{
  const d=e.target.closest('.card');if(d&&e.target.hasAttribute('data-dl'))dl(+d.dataset.i);
});
$('#all').onclick=async()=>{for(let i=0;i<slides.length;i++){dl(i);await new Promise(r=>setTimeout(r,500))}};
['color','mode','bname','burl'].forEach(id=>$('#'+id).addEventListener('input',()=>{save();if(slides.length)redraw()}));
$('#ratio').onchange=()=>{H=+$('#ratio').value;save();if(slides.length)redraw()};
$('#go').onclick=async()=>{
  const key=$('#key').value.trim(),src=$('#src').value.trim(),n=+$('#n').value;
  if(!key)return msg('Gemini API 키를 입력해 주세요.');
  if(!src)return msg('블로그 주소나 글 내용을 붙여넣어 주세요.');
  const isUrl=/^https?:\/\/\S+$/.test(src);
  if(isUrl&&!$('#burl').value)$('#burl').value=src.split(/[?#]/)[0];
  save();$('#go').disabled=true;msg('글을 읽고 카드뉴스를 만드는 중이에요… (10~30초)');
  try{slides=await gen(key,src,isUrl,n);await show()}catch(e){msg(e.message||String(e))}
  $('#go').disabled=false;
};
</script>
</body>
</html>
