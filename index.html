<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>카드뉴스 메이커</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#0f1b33;font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:28px 16px 80px}
h1{margin:0 0 4px;font-size:26px}
.sub{margin:0 0 20px;color:#64748b}
.box{background:#fff;border-radius:16px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
label{display:block;margin:14px 0 6px;font-size:14px;font-weight:600}
label a{font-weight:400;color:#1e4fa3;margin-left:6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d5dbe6;border-radius:10px;font:inherit;background:#fff}
textarea{resize:vertical}
input[type=color]{padding:3px;height:44px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:120px}
button{border:0;border-radius:12px;background:#1e4fa3;color:#fff;font:inherit;font-weight:700;padding:13px 18px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
#go{width:100%;margin-top:20px;font-size:17px;padding:15px}
#msg{margin-top:12px;font-size:14px;color:#b45309;white-space:pre-wrap}
.hint{font-size:13px;color:#64748b;margin-top:6px}
#out{margin-top:28px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.bar b{font-size:18px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{background:#fff;border-radius:16px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:8px}
.card canvas{width:100%;height:auto;border-radius:10px;display:block}
.card input,.card textarea{font-size:14px;padding:9px 10px}
.card button{background:#eaf0fa;color:#1e4fa3;padding:10px}
.presets{display:flex;gap:10px;flex-wrap:wrap}
.ps{background:#fff;color:#0f1b33;border:2px solid #e2e8f0;border-radius:12px;padding:8px 8px 6px;width:92px;font-size:13px;font-weight:600}
.ps.on{border-color:#1e4fa3;box-shadow:0 0 0 3px rgba(30,79,163,.18)}
.ps i{display:block;height:46px;border-radius:8px;margin-bottom:6px;position:relative;border:1px solid rgba(0,0,0,.1)}
.ps i b{position:absolute;right:8px;bottom:8px;width:14px;height:14px;border-radius:50%}
.ph{margin:30px 0 6px;font-size:18px}
.pc{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:14px}
.pc h3{margin:0 0 10px;font-size:16px;color:#1e4fa3}
.pc input,.pc textarea{margin-bottom:8px}
.pc .btns{display:flex;gap:8px;flex-wrap:wrap}
.pc .btns button{background:#eaf0fa;color:#1e4fa3;padding:9px 14px;font-size:14px}
.lk{font-size:12px;color:#64748b;margin-bottom:10px;word-break:break-all}
.th{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}
.th canvas{border-radius:10px;display:block;box-shadow:0 1px 4px rgba(0,0,0,.15)}
#tw{width:min(100%,520px);height:auto}
#ts{width:200px;height:auto}
</style>
</head>
<body>
<main>
<h1>카드뉴스 메이커</h1>
<p class="sub">블로그 주소나 글을 붙여넣으면 깔끔한 카드뉴스가 만들어져요.</p>

<section class="box">
  <label>Gemini API 키 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">무료로 발급받기</a></label>
  <input id="key" type="password" placeholder="AIza..." autocomplete="off">
  <div class="hint">키는 이 브라우저에만 저장돼요.</div>

  <label>블로그 주소 또는 글 내용</label>
  <textarea id="src" rows="7" placeholder="블로그 주소(https://...) 한 줄, 또는 글 내용을 그대로 붙여넣기"></textarea>
  <div class="hint">네이버 블로그는 주소로 읽히지 않는 경우가 많아요. 그럴 땐 글 내용을 복사해서 붙여넣어 주세요.</div>

  <div class="row">
    <div><label>블로그 이름</label><input id="bname" placeholder="예: 도도파파"></div>
    <div><label>블로그 주소 (마지막 카드에 표시)</label><input id="burl" placeholder="예: blog.naver.com/아이디"></div>
  </div>
  <div class="row">
    <div><label>카드 장수</label><select id="n"><option>4</option><option>5</option><option selected>6</option><option>7</option></select></div>
    <div><label>비율</label><select id="ratio"><option value="1920">틱톡 9:16</option><option value="1350" selected>인스타·페이스북 4:5</option><option value="1080">유튜브·정사각 1:1</option></select></div>
    <div><label>마지막 카드에 주소</label><select id="showurl"><option value="0">안 넣기 (권장)</option><option value="1">넣기</option></select></div>
  </div>
  <label>프리셋 (카드 색 스타일)</label>
  <div id="presets" class="presets"></div>
  <button id="go">카드뉴스 만들기</button>
  <div id="msg"></div>
</section>

<section id="out" hidden>
  <div class="bar"><b>완성! 카드 글자와 게시글 문구를 수정할 수 있어요</b><button id="all">전체 저장 (zip)</button></div>
  <div class="pc">
    <h3>대표 썸네일 (블로그용)</h3>
    <div class="th"><canvas id="tw"></canvas><canvas id="ts"></canvas></div>
    <div class="hint" style="margin:0 0 12px">오른쪽처럼 가운데를 정사각형으로 잘라도 글자가 모두 보여요.</div>
    <div class="row">
      <div style="flex:1 1 100%"><label>글 제목 (썸네일 파일 이름으로 사용돼요)</label><input id="th_title"></div>
      <div><label>분류</label><input id="th_tag" placeholder="예: 정부혜택"></div>
      <div><label>제목 1줄</label><input id="th_line1"></div>
      <div><label>제목 2줄</label><input id="th_line2"></div>
      <div><label>부제</label><input id="th_sub"></div>
    </div>
    <div class="btns" style="margin-top:12px"><button id="twd">16:9 저장</button><button id="tsd">정사각형 저장</button><button id="tbd">둘 다 저장</button></div>
  </div>
  <div id="grid"></div>
  <h2 class="ph" style="display:flex;align-items:center;gap:12px">게시글 문구 (플랫폼별) <button id="rp" style="padding:8px 12px;font-size:13px">다시 만들기</button></h2>
  <p class="hint" style="margin:0 0 12px">플랫폼마다 제목과 본문이 따로 만들어져요. 고친 뒤 복사해서 붙여넣으세요.</p>
  <div id="posts"></div>
</section>
</main>

<script>
const $=s=>document.querySelector(s);
const MODELS=['gemini-3.1-flash-lite','gemini-2.5-flash','gemini-2.5-flash-lite'];
const W=1080,SAVE=['key','bname','burl','n','ratio','showurl'];
let H=1350,slides=[],cv=[],preset=0,posts={},last={},thumb={tag:'',line1:'',line2:'',sub:''},postTitle='';

/* ---------- 프리셋 ---------- */
const bright=(n,cbg,bg)=>({n,cbg,bg,cink:'#0f1b33',csub:'#475569',cacc:'#1e4fa3',cline:'rgba(30,79,163,.18)',
  pillBg:'#1e4fa3',pillText:'#ffffff',btnBg:'#1e4fa3',btnText:'#ffffff',deco:'rgba(30,79,163,.07)',
  ink:'#0f1b33',sub:'#475569',acc:'#1e4fa3',line:'rgba(0,0,0,.08)'});
const PRESETS=[
  {n:'메인 블루',cbg:'#1e4fa3',cink:'#ffffff',csub:'#ffffff',cacc:'#ffffff',cline:'rgba(255,255,255,.25)',
   pillBg:'rgba(255,255,255,.2)',pillText:'#ffffff',btnBg:'#ffffff',btnText:'#1e4fa3',deco:'rgba(255,255,255,.08)',
   bg:'#f4f6fa',ink:'#071124',sub:'#475569',acc:'#1e4fa3',line:'rgba(0,0,0,.08)'},
  {n:'블랙 & 블루',cbg:'#0a0a0f',cink:'#ffffff',csub:'#cbd5e1',cacc:'#3d7eff',cline:'rgba(255,255,255,.18)',
   pillBg:'#3d7eff',pillText:'#ffffff',btnBg:'#3d7eff',btnText:'#ffffff',deco:'rgba(61,126,255,.16)',
   bg:'#0a0a0f',ink:'#ffffff',sub:'#b6c0d2',acc:'#3d7eff',line:'rgba(255,255,255,.14)'},
  bright('크림','#f7ecd4','#fffaf0'),
  bright('민트','#d9f1e6','#f2faf6'),
  bright('핑크','#fbdde2','#fff5f6'),
  bright('스카이','#d8e9f9','#f3f8fd')
];

try{SAVE.forEach(k=>{const v=localStorage.getItem('cn_'+k);if(v!==null)$('#'+k).value=v})}catch(e){}
H=+$('#ratio').value;
try{preset=Math.min(PRESETS.length-1,Math.max(0,+localStorage.getItem('cn_preset')||0))}catch(e){}
const save=()=>{try{SAVE.forEach(k=>localStorage.setItem('cn_'+k,$('#'+k).value));localStorage.setItem('cn_preset',preset)}catch(e){}};
const msg=t=>$('#msg').textContent=t||'';

/* ---------- Gemini ---------- */
function makePrompt(src,isUrl,n){
  return `당신은 인스타그램 카드뉴스 기획자입니다. ${isUrl?`다음 블로그 글(${src})을 읽고`:'아래 블로그 글을 바탕으로'} 카드뉴스 ${n}장을 만드세요.
규칙:
- 글에 없는 내용은 절대 지어내지 마세요. 글을 읽을 수 없으면 {"error":"읽을 수 없음"} 만 출력하세요.
- 목표: 요약이 아니라, 끝까지 읽고 저장하고 싶은 카드뉴스입니다. 글에 있는 숫자·조건·예시·주의사항을 빠짐없이 활용해 독자가 바로 써먹을 수 있게 풀어 쓰세요. (글에 없는 내용은 지어내지 말 것)
- 구성: 1장 후킹 → 2장 독자가 겪는 문제나 흔한 오해 짚기 → 3~${n-1}장 해결 방법과 핵심 정보 → ${n}장 결론 + 질문
- 1장 cover: label(주제 2~6자), title(후킹 제목 22자 이내. 글 제목을 그대로 쓰지 말고 질문, 문제 제기, 숫자+이익, 흔한 오해 깨기 중 하나로 쓰기. 형식 예시: "이 서류 빠뜨리면 신청이 반려돼요", "아직도 이자를 다 내고 계세요?"), body(이 카드뉴스를 보면 얻는 것 한 문장 35자 이내)
- 2~${n-1}장 content: highlight(핵심 숫자나 키워드 8자 이내, 없으면 빈 문자열), title(소제목 25자 이내, 결론이나 질문형), body(구체적인 설명 2문장 90자 이내), points(핵심 정보 3개, 각각 "항목: 설명" 형태 40자 이내), tip(꿀팁이나 주의할 점 한 줄 45자 이내)
- ${n}장 cta: title(전체를 한 문장으로 정리 30자 이내), body(독자가 댓글로 답하고 싶어지는 질문 한 문장 35자 이내), source(글에 근거가 있을 때만 출처 기관명, 예: 정부24. 없으면 빈 문자열)
- 카드 글에는 웹사이트 주소, 링크, '블로그 방문' 같은 문구를 절대 쓰지 마세요.
- 쉬운 한국어, 이모지 금지, 한 장에 한 가지 메시지만.
- postTitle: 블로그 글의 실제 제목입니다. 글(또는 페이지)에서 제목으로 쓰인 문장을 그대로 옮기세요. 붙여넣은 글의 첫 줄이 제목이면 그 줄을 쓰고, 제목을 찾을 수 없으면 글 내용을 대표하는 제목을 만드세요.
- thumb(블로그 대표 썸네일 문구): tag(분류 키워드 2~6자, 예: 정부혜택), line1과 line2(postTitle을 의미 단위로 두 줄로 나눈 것, 각 줄 11자 이내. 제목이 길면 핵심만 남기되 원래 표현을 최대한 유지), sub(한 줄 부제 22자 이내)
JSON만 출력: {"postTitle":"","slides":[{"label":"","title":"","body":"","points":[""],"tip":"","highlight":"","source":""}],"thumb":{"tag":"","line1":"","line2":"","sub":""}}${isUrl?'':'\n\n[글]\n'+src.slice(0,12000)}`;
}
function postsPrompt(src,isUrl,sl){
  const cards=sl.map((s,i)=>`${i+1}. ${s.title}${s.body?' - '+s.body:''}`).join('\n');
  return `당신은 SNS 카피라이터입니다. ${isUrl?`블로그 글(${src})을 읽고`:'아래 블로그 글을 바탕으로'} 플랫폼별 게시글 문구(제목+본문)를 쓰세요.
이미 만든 카드뉴스 내용 (참고만 하고 문장을 그대로 반복하지 마세요):
${cards}

공통 원칙:
- 카드 문장을 복사하지 말고, 글 전체를 읽은 사람이 직접 쓴 것처럼 새로 쓰세요. 카드에 없는 구체적인 팁·이유·예시를 글에서 골라 더하세요.
- 구성: 1) 후킹(공감되는 상황, 질문, 의외의 사실로 시작) 2) 핵심 요점 정리 3) 마무리(저장·공유·댓글을 부르는 한 줄)
- 글에 없는 사실이나 수치는 지어내지 마세요. 과장·광고 문구 금지.
- 부드러운 구어체(~해요, ~예요). 한 줄은 짧게, 문단 사이에는 반드시 빈 줄(줄바꿈 2번)을 넣으세요.
- 요점은 ①②③ 기호로 구분하고 한 항목에 한두 줄로 쓰세요. 이모지는 0~2개만 쓰세요.
- 블로그 링크 안내 문구는 쓰지 마세요(자동으로 붙습니다). 마지막 줄은 독자에게 묻는 질문으로 끝내 댓글을 유도하세요. 마무리 질문 앞에는 글에 실제로 있는 내용 중 카드에 담지 못한 한 가지를 궁금증이 생기게 예고하는 한 줄을 넣으세요(예: 업종별 사례와 작성 예시는 본문에 정리해 뒀어요).
플랫폼별 형식:
- instagram: title 30자 이내 후킹 한 줄 / body: 후킹 1~2줄 → 빈 줄 → 요점 ①②③ → 빈 줄 → 마무리 한 줄 → 빈 줄 → 해시태그 5~8개
- facebook: title 40자 이내 / body: 공감 도입 2~3문장 → 빈 줄 → 요점 3개를 각각 별도 문단으로(문단마다 1~2문장, 사이에 빈 줄) → 빈 줄 → 마무리 질문 한 줄. 한 덩어리로 이어 쓰지 마세요.
- tiktok: title 40자 이내 짧은 후킹 / body: 요점 2~3줄 + 질문 한 줄 → 빈 줄 → 해시태그 3~5개
- youtube: title 60자 이내(핵심 키워드 포함, 클릭을 부르되 과장 금지) / body: 핵심 요약 2문장 → 빈 줄 → 요점 ①②③ → 빈 줄 → 마무리 한 줄 → 빈 줄 → 해시태그 3~5개
줄바꿈이 필요한 곳은 JSON 문자열 안에서 줄바꿈 기호(백슬래시 n)로 표현하세요.
JSON만 출력: {"posts":{"instagram":{"title":"","body":""},"facebook":{"title":"","body":""},"tiktok":{"title":"","body":""},"youtube":{"title":"","body":""}}}${isUrl?'':'\n\n[글]\n'+src.slice(0,12000)}`;
}
// 문자열 안의 실제 줄바꿈 때문에 JSON이 깨졌을 때 고쳐서 읽기
const fixJson=t=>{let o='',q=0,e=0;for(const c of t){if(q){if(e){o+=c;e=0}else if(c==='\\'){o+=c;e=1}else if(c==='"'){o+=c;q=0}else o+=c==='\n'?'\\n':(c==='\r'||c==='\t')?' ':c}else{o+=c;if(c==='"')q=1}}return o};
async function ask(key,prompt,isUrl){
  let err='';
  for(const m of MODELS){
    const body={contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:.8}};
    if(isUrl)body.tools=[{url_context:{}}];else body.generationConfig.responseMimeType='application/json';
    let r,j;
    try{
      r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});
      j=await r.json();
    }catch(e){throw new Error('네트워크 오류가 났어요. 인터넷 연결을 확인해 주세요.')}
    if(!r.ok){
      err=(j.error&&j.error.message)||('오류 '+r.status);
      if(/API key/i.test(err))throw new Error('API 키가 올바르지 않아요. 키를 다시 확인해 주세요.');
      continue; // 다음 모델로 재시도
    }
    const c=(j.candidates||[])[0]||{};
    const text=((c.content||{}).parts||[]).map(p=>p.text||'').join('');
    if(isUrl){
      const md=c.urlContextMetadata||c.url_context_metadata||{};
      const list=md.urlMetadata||md.url_metadata||[];
      if(!list.some(u=>/SUCCESS/.test(u.urlRetrievalStatus||u.url_retrieval_status||'')))
        throw new Error('이 주소의 글을 읽지 못했어요.\n글 내용을 복사해서 붙여넣어 주세요.');
    }
    let o;
    try{
      const t0=text.replace(/```json|```/g,'').match(/\{[\s\S]*\}/)[0];
      try{o=JSON.parse(t0)}catch(e2){o=JSON.parse(fixJson(t0))}
    }catch(e){err='결과를 해석하지 못했어요. 다시 시도해 주세요.';continue}
    if(o.error)throw new Error('글을 읽을 수 없었어요. 글 내용을 복사해서 붙여넣어 주세요.');
    return o;
  }
  throw new Error('생성에 실패했어요: '+err+'\n(무료 한도 초과일 수 있어요. 잠시 후 다시 시도해 주세요.)');
}
function split2(t){
  const w=String(t||'').split(' ');if(w.length<2)return[w[0]||'',''];
  let best=1,bd=1e9;
  for(let i=1;i<w.length;i++){const d=Math.abs(w.slice(0,i).join(' ').length-w.slice(i).join(' ').length);if(d<bd){bd=d;best=i}}
  return[w.slice(0,best).join(' '),w.slice(best).join(' ')];
}
function normThumb(t,a){
  t=t||{};const c=a[0],[f1,f2]=split2(postTitle||c.title);
  return{tag:String(t.tag||c.label||'').trim(),line1:String(t.line1||f1).trim(),line2:String(t.line2||f2).trim(),sub:String(t.sub||c.body||'').trim()};
}
async function gen(key,src,isUrl,n){
  const o=await ask(key,makePrompt(src,isUrl,n),isUrl);
  let a=(o.slides||[]).filter(s=>s&&s.title);
  if(a.length<2)throw new Error('카드를 만들지 못했어요. 다시 시도해 주세요.');
  if(a.length>n)a=[...a.slice(0,n-1),a[a.length-1]];
  a.forEach(x=>{x.points=Array.isArray(x.points)?x.points.map(String).filter(Boolean).slice(0,3):[];x.tip=String(x.tip||'').trim()});
  postTitle=String(o.postTitle||'').trim();
  thumb=normThumb(o.thumb,a);
  return a;
}

/* ---------- 카드 그리기 ---------- */
const F=(w,s)=>`${w} ${s}px Pretendard,"Noto Sans KR",system-ui,sans-serif`;
const rr=(x,a,b,w,h,r)=>{x.beginPath();x.roundRect?x.roundRect(a,b,w,h,r):x.rect(a,b,w,h)};
function wrap(x,t,max){ // 단어 단위 줄바꿈 (긴 단어만 글자 단위)
  const out=[];
  for(const para of String(t||'').split('\n')){
    let cur='';
    for(const w of para.split(' ')){
      const s=cur?cur+' '+w:w;
      if(x.measureText(s).width<=max){cur=s;continue}
      if(cur){out.push(cur);cur=''}
      if(x.measureText(w).width<=max){cur=w;continue}
      for(const ch of w){if(x.measureText(cur+ch).width>max){out.push(cur);cur=ch}else cur+=ch}
    }
    out.push(cur);
  }
  return out;
}
function fit(x,t,wt,size,min,max,ln){ // 줄 수가 넘치면 글자 크기를 줄임
  let s=size,l;
  for(;;){x.font=F(wt,s);l=wrap(x,t,max);if(l.length<=ln||s<=min)return{s,l};s-=4}
}
function draw(i){
  const s=slides[i],c=cv[i],x=c.getContext('2d'),T=PRESETS[preset];
  const P=96,M=W-P*2,N=slides.length,bn=$('#bname').value.trim();
  const url=$('#burl').value.trim().replace(/^https?:\/\//,'').replace(/\/$/,'');
  c.width=W;c.height=H;
  const cover=i===0,cta=i===N-1,solid=cover||cta;
  const ink=solid?T.cink:T.ink,sub=solid?T.csub:T.sub;
  x.fillStyle=solid?T.cbg:T.bg;x.fillRect(0,0,W,H);
  if(solid){x.fillStyle=T.deco;x.beginPath();x.arc(W-40,120,300,0,7);x.fill();x.beginPath();x.arc(80,H-60,200,0,7);x.fill()}
  x.textBaseline='top';
  // 상단: 블로그 이름 / 페이지 번호
  x.font=F(600,28);x.fillStyle=sub;x.globalAlpha=.75;
  x.textAlign='left';x.fillText(bn,P,P-8);
  x.textAlign='right';x.fillText(String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0'),W-P,P-8);
  x.globalAlpha=1;
  // 하단: 진행 막대
  x.fillStyle=solid?T.cline:T.line;x.fillRect(P,H-P+10,M,6);
  x.fillStyle=solid?T.cacc:T.acc;x.fillRect(P,H-P+10,M*(i+1)/N,6);
  x.textAlign='left';

  const mk=sc=>{
    const bl=[],K=H>1500?1.2:1;
    const txt=(t,wt,size,min,ln,lh,col,al,gap)=>{
      if(!String(t||'').trim())return;
      const f=fit(x,t,wt,Math.round(size*sc*K),Math.round(min*sc*K),M,ln);
      bl.push({h:f.l.length*f.s*lh,gap,d:y=>{x.font=F(wt,f.s);x.fillStyle=col;x.globalAlpha=al;
        f.l.forEach((l,k)=>x.fillText(l,P,y+k*f.s*lh+(lh-1)*f.s/2));x.globalAlpha=1}});
    };
    if(cover){
      if(String(s.label||'').trim()){
        x.font=F(700,30);const w=x.measureText(s.label).width+56;
        bl.push({h:64,gap:0,d:y=>{x.fillStyle=T.pillBg;rr(x,P,y,w,64,32);x.fill();
          x.font=F(700,30);x.fillStyle=T.pillText;x.fillText(s.label,P+28,y+17)}});
      }
      txt(s.title,900,132,76,5,1.18,ink,1,60);
      txt(s.body,600,46,34,3,1.5,sub,.95,48);
    }else if(cta){
      txt(s.title,800,84,56,4,1.25,ink,1,0);
      txt(s.body,500,44,34,3,1.5,sub,.9,40);
    }else{
      bl.push({h:10,gap:0,d:y=>{x.fillStyle=T.acc;rr(x,P,y,90,10,5);x.fill()}});
      txt(s.highlight,900,150,64,1,1.1,T.acc,1,44);
      txt(s.title,800,76,50,3,1.25,ink,1,s.highlight?20:44);
      txt(s.body,500,44,32,8,1.6,sub,1,36);
      (s.points||[]).filter(t=>String(t).trim()).forEach((t,k)=>{
        const sz=Math.round(40*sc*K);x.font=F(600,sz);
        const l=wrap(x,t,M-72),h=Math.max(l.length,1)*sz*1.45;
        bl.push({h,gap:k?22:40,d:y=>{
          x.fillStyle=T.acc;x.beginPath();x.arc(P+24,y+sz*.72,22,0,7);x.fill();
          x.font=F(800,26);x.fillStyle=T.bg;x.textAlign='center';x.fillText(String(k+1),P+24,y+sz*.72-13);x.textAlign='left';
          x.font=F(600,sz);x.fillStyle=ink;l.forEach((q,i)=>x.fillText(q,P+72,y+i*sz*1.45+sz*.225));
        }});
      });
      if(String(s.tip||'').trim()){
        const sz=Math.round(36*sc*K),lab=Math.round(26*sc*K),pad=30;x.font=F(600,sz);
        const l=wrap(x,s.tip,M-90),h=pad*2+lab*1.5+l.length*sz*1.5;
        bl.push({h,gap:44,d:y=>{
          x.globalAlpha=.14;x.fillStyle=T.acc;rr(x,P,y,M,h,24);x.fill();x.globalAlpha=1;
          x.fillStyle=T.acc;rr(x,P,y,10,h,5);x.fill();
          x.font=F(800,lab);x.fillText('TIP',P+44,y+pad);
          x.font=F(600,sz);x.fillStyle=ink;l.forEach((q,i)=>x.fillText(q,P+44,y+pad+lab*1.5+i*sz*1.5));
        }});
      }
    }
    return bl;
  };
  const tall=H>1500?260:0,top=P+90,bottom=(cta?H-P-290:H-P-50)-tall,avail=bottom-top;
  let sc=1,bl,total;
  for(;;){
    bl=mk(sc);total=bl.reduce((a,b,k)=>a+b.h+(k?b.gap*sc:0),0);
    if(total<=avail||sc<=.6)break;sc-=.08;
  }
  let y=top+Math.max(0,Math.min((avail-total)/2,solid?999:160));
  bl.forEach((b,k)=>{if(k)y+=b.gap*sc;b.d(y);y+=b.h});

  if(cover){x.textAlign='right';x.font=F(600,30);x.fillStyle=T.cink;x.globalAlpha=.85;x.fillText('옆으로 넘겨보세요 →',W-P,H-P-50-tall);x.globalAlpha=1;x.textAlign='left'}
  if(cta){ // 저장·댓글 유도 + 출처 (주소는 선택)
    const by=H-P-250-tall,bh=120,showUrl=$('#showurl').value==='1'&&url;
    x.fillStyle=T.btnBg;rr(x,P,by,M,bh,60);x.fill();
    x.fillStyle=T.btnText;x.font=F(800,showUrl?42:40);x.textAlign='center';
    x.fillText(showUrl?'아래 링크에서 확인하세요  ↓':'저장해 두고 댓글로 물어보세요',W/2,by+(bh-42)/2);
    let yy=by+bh+30;
    if(showUrl){
      let fs=42;x.font=F(800,fs);
      while(x.measureText(url).width>M&&fs>26){fs-=2;x.font=F(800,fs)}
      let u=url;while(x.measureText(u).width>M&&u.length>8)u=u.slice(0,-2);
      if(u!==url)u=u.trimEnd()+'…';
      x.fillStyle=T.cink;x.fillText(u,W/2,yy);yy+=64;
    }
    const src=String(s.source||'').trim().replace(/^출처:?\s*/,'');
    if(src){x.font=F(500,26);x.fillStyle=T.csub;x.globalAlpha=.85;x.fillText('출처: '+src,W/2,yy);x.globalAlpha=1}
    x.textAlign='left';
  }
}
const redraw=()=>slides.forEach((_,i)=>draw(i));

/* ---------- 대표 썸네일 (1280x720 기준, 정사각형 크롭 안전) ---------- */
function drawThumb(c,mode){
  const sq=mode==='sq',k=sq?1.5:1;
  c.width=sq?1080:1280;c.height=sq?1080:720;
  const x=c.getContext('2d');
  x.setTransform(k,0,0,k,sq?-280*k:0,0); // 정사각형: 가운데 720px만 사용
  const g=x.createLinearGradient(0,0,1280,720);
  g.addColorStop(0,'#1e3a8a');g.addColorStop(.55,'#13265f');g.addColorStop(1,'#030712');
  x.fillStyle=g;x.fillRect(0,0,1280,720);
  x.textBaseline='top';x.textAlign='left';
  const SAFE=640,t=thumb;
  const head=[t.line1,t.line2].filter(Boolean).join('\n');
  const hf=fit(x,head,800,80,44,SAFE,2),hl=hf.l.filter(Boolean);
  x.font=F(800,hf.s);
  const widest=Math.max(1,...hl.map(l=>x.measureText(l).width));
  const sf=fit(x,t.sub||'',600,34,24,SAFE,1);
  const ph=t.tag?66:0,lh=hf.s*1.3,subH=t.sub?sf.s*1.4:0;
  const total=ph+(ph?24:0)+hl.length*lh+(subH?26:0)+subH;
  let y=(720-total)/2;
  const bx=(1280-widest)/2;
  if(t.tag){
    x.font=F(700,28);const pw=x.measureText(t.tag).width+48;
    x.fillStyle='rgba(4,9,24,.88)';rr(x,bx,y,pw,ph,10);x.fill();
    x.fillStyle='#60a5fa';x.fillText(t.tag,bx+24,y+(ph-28)/2);
    y+=ph+24;
  }
  x.shadowColor='rgba(0,0,0,.55)';x.shadowBlur=14;x.shadowOffsetY=4;
  x.font=F(800,hf.s);x.fillStyle='#ffffff';
  hl.forEach((l,i)=>x.fillText(l,bx,y+i*lh+(lh-hf.s)/2));
  y+=hl.length*lh+26;
  if(t.sub){x.font=F(600,sf.s);x.textAlign='center';x.fillText(sf.l[0]||'',640,y+(sf.s*1.4-sf.s)/2)}
  x.shadowColor='transparent';x.textAlign='left';
}
const drawThumbs=()=>{drawThumb($('#tw'),'wide');drawThumb($('#ts'),'sq')};
function thumbUI(){['tag','line1','line2','sub'].forEach(k=>$('#th_'+k).value=thumb[k]||'');$('#th_title').value=postTitle;drawThumbs()}
$('#th_title').addEventListener('input',e=>{postTitle=e.target.value});
['tag','line1','line2','sub'].forEach(k=>$('#th_'+k).addEventListener('input',e=>{thumb[k]=e.target.value;drawThumbs()}));
const rlab=()=>H===1920?'9x16':H===1350?'4x5':'1x1';
const saveC=(c,n)=>c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)});
const safeName=t=>String(t||'').replace(/[\\\/:*?"<>|\r\n\t]+/g,' ').replace(/\s+/g,' ').trim().slice(0,60);
const thumbName=()=>safeName(postTitle||[thumb.line1,thumb.line2].filter(Boolean).join(' '))||'thumbnail';
$('#twd').onclick=()=>saveC($('#tw'),thumbName()+'.png');
$('#tsd').onclick=()=>saveC($('#ts'),thumbName()+'_정사각형.png');
$('#tbd').onclick=async()=>{$('#twd').click();await new Promise(r=>setTimeout(r,500));$('#tsd').click()};

/* ---------- 화면 ---------- */
async function show(){
  const all=slides.map(s=>Object.values(s).join('')).join('')+Object.values(thumb).join('')+'아래 링크에서 확인하세요 옆으로 넘겨보세요 ↓0123456789/';
  try{await Promise.all([500,600,700,800,900].map(w=>document.fonts.load(`${w} 40px Pretendard`,all)))}catch(e){}
  const g=$('#grid');g.innerHTML='';cv=[];
  slides.forEach((s,i)=>{
    const d=document.createElement('div');d.className='card';d.dataset.i=i;
    const last=i===slides.length-1,k2=i===0?'label':last?'source':'highlight';
    const ph={label:'주제 키워드 (선택)',source:'출처 (예: 정부24)',highlight:'강조 숫자·키워드 (선택)'}[k2];
    d.innerHTML='<canvas></canvas><input data-k="title" placeholder="제목"><textarea data-k="body" rows="2" placeholder="본문"></textarea>'
      +(i>0&&!last?'<textarea data-k="points" rows="3" placeholder="핵심 항목 (한 줄에 하나씩)"></textarea><input data-k="tip" placeholder="꿀팁·주의할 점 (선택)">':'')
      +`<input data-k="${k2}" placeholder="${ph}">`+'<button data-dl>이 카드 저장</button>';
    ['title','body',k2].forEach(k=>{const e=d.querySelector(`[data-k="${k}"]`);if(e)e.value=s[k]||''});
    const te=d.querySelector('[data-k="tip"]');if(te)te.value=s.tip||'';
    const pe=d.querySelector('[data-k="points"]');if(pe)pe.value=(s.points||[]).join('\n');
    cv.push(d.querySelector('canvas'));g.append(d);
  });
  $('#out').hidden=false;redraw();thumbUI();msg('');
  $('#out').scrollIntoView({behavior:'smooth'});
}
function dl(i){
  cv[i].toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='cardnews_'+rlab()+'_'+String(i+1).padStart(2,'0')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)});
}
$('#grid').addEventListener('input',e=>{
  const d=e.target.closest('.card');if(!d||!e.target.dataset.k)return;
  const kk=e.target.dataset.k,v=e.target.value;slides[+d.dataset.i][kk]=kk==='points'?v.split('\n'):v;draw(+d.dataset.i);
});
$('#grid').addEventListener('click',e=>{
  const d=e.target.closest('.card');if(d&&e.target.hasAttribute('data-dl'))dl(+d.dataset.i);
});
$('#all').onclick=async()=>{
  const b=$('#all');b.disabled=true;
  try{
    if(!window.JSZip)throw 0;
    const z=new JSZip();
    for(let i=0;i<cv.length;i++){
      const blob=await new Promise(r=>cv[i].toBlob(r));
      z.file('cardnews_'+rlab()+'_'+String(i+1).padStart(2,'0')+'.png',blob);
    }
    z.file(thumbName()+'.png',await new Promise(r=>$('#tw').toBlob(r)));
    z.file(thumbName()+'_정사각형.png',await new Promise(r=>$('#ts').toBlob(r)));
    const out=await z.generateAsync({type:'blob'});
    const a=document.createElement('a');a.href=URL.createObjectURL(out);a.download='cardnews_'+rlab()+'.zip';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(e){for(let i=0;i<cv.length;i++){dl(i);await new Promise(r=>setTimeout(r,500))}}
  b.disabled=false;
};
function presetButtons(){
  $('#presets').innerHTML=PRESETS.map((p,k)=>`<button type="button" class="ps${k===preset?' on':''}" data-p="${k}"><i style="background:linear-gradient(90deg,${p.cbg} 50%,${p.bg} 50%)"><b style="background:${p.acc}"></b></i>${p.n}</button>`).join('');
}
$('#presets').addEventListener('click',e=>{
  const b=e.target.closest('[data-p]');if(!b)return;
  preset=+b.dataset.p;save();presetButtons();if(slides.length)redraw();
});
presetButtons();
['bname','burl','showurl'].forEach(id=>$('#'+id).addEventListener('input',()=>{save();if(slides.length){redraw();updHint()}}));
$('#ratio').onchange=()=>{H=+$('#ratio').value;save();if(slides.length)redraw()};
/* ---------- 게시글 문구 (제목 + 본문, 복사) ---------- */
async function makePosts(){
  const b=$('#rp');b.disabled=true;
  $('#posts').innerHTML='<p class="hint">게시글 문구를 만드는 중이에요… (10~30초)</p>';
  let err='';
  try{const o=await ask(last.key,postsPrompt(last.src,last.isUrl,slides),last.isUrl);posts=o.posts||o}
  catch(e){posts={};err=e.message||String(e)}
  showPosts();
  if(err){const p=document.createElement('p');p.className='hint';
    p.textContent='AI 문구를 만들지 못해 카드 내용으로 대신 채웠어요. "다시 만들기"를 눌러 보세요. ('+err.split('\n')[0]+')';
    $('#posts').prepend(p)}
  b.disabled=false;
}
$('#rp').onclick=()=>{if(slides.length&&last.key)makePosts()};
const norm=t=>String(t||'').replace(/\\n/g,'\n').trim();
const PLAT=[['instagram','인스타그램'],['facebook','페이스북 페이지'],['tiktok','틱톡'],['youtube','유튜브']];
const fullUrl=()=>{const u=$('#burl').value.trim();return u?(/^https?:\/\//.test(u)?u:'https://'+u):''};
const linkFor=k=>{const u=fullUrl();
  if(k==='facebook'||k==='youtube')return u?'자세한 내용은 아래 링크에서 확인하세요\n'+u:'';
  return '자세한 내용은 프로필 링크에서 확인하세요'};
const hintFor=k=>(k==='facebook'||k==='youtube')
  ?(fullUrl()?'복사할 때 본문 끝에 블로그 주소가 붙어요: '+fullUrl():'블로그 주소를 입력하면 복사할 때 본문 끝에 붙어요.')
  :'주소 없이 "프로필 링크" 안내 문구만 붙어요. (프로필에 링크를 넣을 수 있을 때만 사용하세요)';
const updHint=()=>document.querySelectorAll('#posts .pc').forEach(d=>{const e=d.querySelector('.lk');if(e)e.textContent=hintFor(d.dataset.k)});
function showPosts(){
  const mid=slides.slice(1,-1).map(s=>s.title+(s.body?' - '+s.body:'')).join('\n');
  const box=$('#posts');box.innerHTML='';
  PLAT.forEach(([k,name])=>{
    const p=(posts&&posts[k])||{};
    const d=document.createElement('div');d.className='pc';d.dataset.k=k;
    d.innerHTML=`<h3>${name}</h3><input data-f="t" placeholder="제목"><textarea data-f="b" rows="12" placeholder="본문"></textarea><div class="lk"></div><div class="btns"><button data-c="t">제목 복사</button><button data-c="b">본문 복사</button><button data-c="a">제목+본문 복사</button></div>`;
    d.querySelector('[data-f="t"]').value=norm(p.title)||slides[0].title;
    d.querySelector('[data-f="b"]').value=norm(p.body)||mid;
    box.append(d);
  });
  updHint();
}
async function doCopy(t,btn){
  try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove()}
  const o=btn.textContent;btn.textContent='복사됨!';setTimeout(()=>btn.textContent=o,1200);
}
$('#posts').addEventListener('click',e=>{
  const b=e.target.closest('[data-c]');if(!b)return;
  const d=b.closest('.pc'),t=d.querySelector('[data-f="t"]').value.trim(),body=d.querySelector('[data-f="b"]').value.trim(),l=linkFor(d.dataset.k);
  const full=body+(l?'\n\n'+l:'');
  doCopy(b.dataset.c==='t'?t:b.dataset.c==='b'?full:t+'\n\n'+full,b);
});

$('#go').onclick=async()=>{
  const key=$('#key').value.trim(),src=$('#src').value.trim(),n=+$('#n').value;
  if(!key)return msg('Gemini API 키를 입력해 주세요.');
  if(!src)return msg('블로그 주소나 글 내용을 붙여넣어 주세요.');
  const isUrl=/^https?:\/\/\S+$/.test(src);
  if(isUrl&&!$('#burl').value)$('#burl').value=src.split(/[?#]/)[0];
  save();$('#go').disabled=true;msg('글을 읽고 카드뉴스를 만드는 중이에요… (10~30초)');
  try{slides=await gen(key,src,isUrl,n);posts={};last={key,src,isUrl};await show();await makePosts()}catch(e){msg(e.message||String(e))}
  $('#go').disabled=false;
};
